NAME : "finetuner_provincia"

################################### PATHS SETTINGS ###################################
BASE_MODEL_PATH : "models/base_models/paraphrase-MiniLM-L6-v2"
# DATASET_PATH : "datasets/finetuning/provincias_abreviaciones.csv"
DATASET_PATH : "datasets/finetuning/tripletas.txt"
OUTPUT_DIR : "models/training/provincia"
ABBREVIATIONS_PATH : "datasets/finetuning/palabras_abreviaciones.json"

################################### HYPERPARAMETER SETTINGS ###################################
BATCH_SIZE : 32
EPOCHS : 9999
LR:  2e-5

################################### CHECKPOINTS SETTINGS ###################################
CHECKPOINT_SAVE_STEPS : 30
CHECKPOINT_SAVE_TOTAL_LIMIT : 5

################################### LOSS SETTINGS ###################################
LOSS : "triplet"  # {mnr, triplet}

################################### SENTENCE AUGMENTATION SETTINGS ###################################
AUGMENTATION : True
AUGMENTATION_KEYBOARD_MISTAKE_PROBABILITY:  0.2
AUGMENTATION_ABBREVIATIONS_PROBABILITY:  1
AUG_WORD_MAX : 1
AUG_CHAR_MAX : 1 

################################### VERBOSE SETTINGS ###################################
SHOW_PROGRESS_BAR : True
SHOW_LOSS : True

################################### LOGGING SETTINGS ###################################
SAVE_LOGS: False
LOGS_FILE_PATH: "logs/base_maestro_sample.log"